# Exemple de QCM — Thermodynamique (format v1)
titre: Thermodynamique — Chapitre 3
matiere: Physique L2
auteur: Nino
melanger_questions: true
melanger_options: true

questions:
  - id: thermo-01
    type: qcm
    enonce: "D'après le premier principe, la variation d'énergie interne ΔU d'un système fermé vaut :"
    options:
      - { texte: "ΔU = W + Q", exacte: true }
      - { texte: "ΔU = W − Q" }
      - { texte: "ΔU = Q / W" }
      - { texte: "ΔU = −W − Q" }
    justification: |
      Convention thermodynamique : W est le travail reçu par le système,
      Q la chaleur reçue. Les deux augmentent l'énergie interne (cours p. 42).
    chapitre: Premier principe
    niveau: 1
    tags: [premier-principe, energie]

  - id: thermo-02
    type: qcm_multiple
    enonce: "Parmi ces grandeurs, lesquelles sont des fonctions d'état ? (plusieurs réponses)"
    options:
      - { texte: "L'énergie interne U", exacte: true }
      - { texte: "L'entropie S", exacte: true }
      - { texte: "Le travail W" }
      - { texte: "La chaleur Q" }
    justification: "U et S ne dépendent que de l'état du système, pas du chemin suivi. W et Q dépendent du chemin."
    chapitre: Fonctions d'état
    niveau: 2
    tags: [etat, entropie]

  - id: thermo-03
    type: vrai_faux
    reponse: false
    enonce: "Dans une transformation adiabatique, le système échange de la chaleur avec l'extérieur."
    justification: "Adiabatique = Q = 0 : aucun échange de chaleur. Le travail peut lui être non nul."
    chapitre: Transformations usuelles
    niveau: 1
    tags: [adiabatique]

  - id: thermo-04
    type: qcm
    enonce: "Pour un gaz parfait, lors d'une détente isotherme :"
    options:
      - { texte: "ΔU = 0 et Q = W", exacte: true }
      - { texte: "ΔU > 0 et Q = 0" }
      - { texte: "ΔT = 0 et W = 0" }
    justification: "Gaz parfait : U ne dépend que de T. Isotherme ⇒ ΔU = 0, donc Q = W d'après le premier principe."
    chapitre: Gaz parfait
    niveau: 2
    tags: [gaz-parfait, isotherme]
